<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FRIDAY MK 2.3</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>

<body class="locked">

<header>

  <div>
    <small>STARK SYSTEMS</small>
    <h1>F.R.I.D.A.Y <span>MK 2.3</span></h1>
  </div>

  <button id="loginBtn">LOGIN</button>

</header>


<main>

<!-- FRIDAY CORE -->

<section class="coreArea">

  <div class="hud">

    <div class="ring outer"></div>
    <div class="ring middle"></div>
    <div class="ring inner"></div>

    <div class="arc arc1"></div>
    <div class="arc arc2"></div>

    <div class="core">

      <div class="pulse"></div>

      <b>FRIDAY</b>

    </div>

  </div>

  <div id="status">
    FRIDAY — SLEEP MODE
  </div>

</section>


<!-- CONTROLS -->

<div class="controls">

  <button id="unlockBtn">
    🔓
    <small>UNLOCK</small>
  </button>

  <button id="voiceBtn">
    🎤
    <small>VOICE</small>
  </button>

  <button id="neuralBtn">
    🧠
    <small>NEURAL</small>
  </button>

  <button id="handBtn">
    ✋
    <small>HAND</small>
  </button>

</div>


<!-- COMMAND -->

<div class="command">

  <input
    id="command"
    placeholder="FRIDAY is sleeping..."
    disabled
  >

  <button id="sendBtn">➤</button>

</div>

<div id="reply">
  SYSTEM STANDBY
</div>

</main>


<!-- NEURAL SYSTEM -->

<div id="neuralScreen">

  <div class="neuralHeader">

    <div>
      <small>FRIDAY NEURAL CORE</small>
      <h2>NEURAL SYSTEM</h2>
    </div>

    <button id="exitNeural">EXIT</button>

  </div>

  <canvas id="neuralCanvas"></canvas>

  <div class="neuralInfo">

    <b>HAND CONTROL</b>

    <br>

    <span id="gesture">
      HAND TRACKING OFF
    </span>

  </div>

</div>


<!-- CAMERA -->

<div id="cameraBox">

  <video id="video" autoplay playsinline></video>

  <canvas id="handCanvas"></canvas>

  <div>
    <b>HAND TRACKING</b>
    <br>
    <span id="handStatus">SEARCHING...</span>
  </div>

  <button id="closeHand">✕</button>

</div>


<!-- LOGIN -->

<div id="loginPanel">

  <div class="loginBox">

    <button id="closeLogin">✕</button>

    <div class="loginLogo">F</div>

    <h2>FRIDAY LOGIN</h2>

    <small>AUTHORIZATION REQUIRED</small>

    <input id="username" placeholder="USERNAME">

    <input id="password"
           type="password"
           placeholder="PASSWORD">

    <button id="loginSubmit">
      AUTHENTICATE
    </button>

    <p id="loginStatus"></p>

  </div>

</div>


<!-- TRANSITION -->

<div id="transition"></div>


<script src="script.js"></script>

</body>
</html>
