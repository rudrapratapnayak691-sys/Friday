<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRIDAY MARK 2</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="ui">

<header>
  <div>
    <small>STARK INDUSTRIES</small>
    <h2>F.R.I.D.A.Y <span>MK II</span></h2>
  </div>
  <button id="lockBtn" onclick="toggleLock()">🔒</button>
</header>

<div class="hud">

  <div class="scanner"></div>

  <div class="core">
    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>

    <div class="coreText">F</div>
  </div>

</div>

<div id="status">SYSTEM LOCKED</div>

<div class="panel">

<button onclick="voice()">🎤<small>VOICE</small></button>

<button onclick="showNeural()">🧠<small>NEURAL</small></button>

<button onclick="run()">⚡<small>EXECUTE</small></button>

</div>

<div class="command">

<input id="cmd" placeholder="Ask FRIDAY...">

<button onclick="run()">➤</button>

</div>

<div id="reply">Awaiting command...</div>

</div>


<div id="neural">

<button class="exit" onclick="hideNeural()">✕ EXIT</button>

<h1>NEURAL SYSTEM</h1>

<div class="neuralStatus">
ONLINE • NEURAL CORE ACTIVE
</div>

<canvas id="brain"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
