<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRIDAY MK 2.2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body class="locked">

<div id="app">

<header>
  <div>
    <small>STARK SYSTEMS</small>
    <h2>F.R.I.D.A.Y <span>MK 2.2</span></h2>
  </div>

  <button id="lockBtn">🔒</button>
</header>

<div class="hud">

  <div class="core">
    <div class="orbit one"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>

    <div class="coreLetter">F</div>
  </div>

</div>

<div id="status">SYSTEM LOCKED</div>

<div class="controls">

  <button id="unlockBtn" onclick="toggleLock()">
    🔓
    <small>UNLOCK</small>
  </button>

  <button onclick="startHands()">
    ✋
    <small>HAND TRACK</small>
  </button>

  <button onclick="showNeural()">
    🧠
    <small>NEURAL</small>
  </button>

  <button onclick="voice()">
    🎤
    <small>VOICE</small>
  </button>

</div>

<div class="command">
  <input id="cmd" placeholder="Ask FRIDAY...">
  <button onclick="run()">➤</button>
</div>

<div id="reply">Awaiting command...</div>

</div>


<!-- NEURAL SYSTEM -->

<div id="neural">

  <div class="neuralTop">
    <div>
      <small>FRIDAY CORE</small>
      <h1>NEURAL SYSTEM</h1>
    </div>

    <button onclick="hideNeural()">✕ EXIT</button>
  </div>

  <div class="neuralButtons">

    <button onclick="zoomNeural(1.2)">
      ＋ ZOOM
    </button>

    <button onclick="zoomNeural(.8)">
      − ZOOM
    </button>

    <button onclick="resetNeural()">
      ⟳ RESET
    </button>

    <button onclick="startHands()">
      ✋ HAND
    </button>

  </div>

  <canvas id="brain"></canvas>

</div>


<!-- HAND TRACKING -->

<div id="handUI">

  <video id="video" autoplay playsinline></video>

  <canvas id="handCanvas"></canvas>

  <div class="handInfo">
    <b>HAND TRACKING</b>
    <br>
    <span id="gesture">SEARCHING FOR HAND...</span>
  </div>

  <button class="closeHand" onclick="stopHands()">
    ✕
  </button>

</div>


<script src="script.js"></script>

</body>
</html>
