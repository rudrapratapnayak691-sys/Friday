<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>FRIDAY MARK 5</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>

<body class="locked">

<header>
    <div>
        <div class="system">S T A R K &nbsp; S Y S T E M S</div>

        <div class="logo">
            F.R.I.D.A.Y
            <span>MK 2.3</span>
        </div>
    </div>

    <button id="loginBtn" class="loginBtn">
        LOGIN
    </button>

    <div id="profileBtn"
         class="profileBtn"
         style="display:none;">
        👤 <span id="profileName">PROFILE</span>
    </div>
</header>

<main>

    <div id="status">
        FRIDAY — SLEEP MODE
    </div>

    <!-- MAIN FRIDAY CORE -->

    <div class="coreArea">

        <div class="rings r1"></div>
        <div class="rings r2"></div>
        <div class="rings r3"></div>

        <div class="core"></div>

        <div class="fridayText">
            FRIDAY
        </div>

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <button id="unlockBtn">
            🔓
            <small>UNLOCK</small>
        </button>

        <button id="voiceBtn">
            🎤
            <small>VOICE</small>
        </button>

        <button id="neuralBtn">
            🧠
            <small>NEURAL</small>
        </button>

        <button id="handBtn">
            ✋
            <small>HAND</small>
        </button>

    </div>

    <div id="reply">
        SYSTEM STANDBY
    </div>

    <!-- COMMAND -->

    <div class="commandArea">

        <input
            id="command"
            type="text"
            disabled
            placeholder="FRIDAY is sleeping..."
        >

        <button id="sendBtn">
            ➤
        </button>

    </div>

</main>


<!-- CAMERA -->

<div id="cameraBox">

    <button id="closeHand">
        ✕
    </button>

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <canvas id="handCanvas"></canvas>

    <div id="handStatus">
        HAND TRACKING
    </div>

    <div id="gesture">
        ✋ HAND — ROTATE
    </div>

</div>


<!-- NEURAL SCREEN -->

<div id="neuralScreen">

    <button id="exitNeural">
        ✕ CLOSE
    </button>

    <canvas id="neuralCanvas"></canvas>

</div>


<!-- LOGIN -->

<div id="loginPanel">

    <div class="loginBox">

        <button id="closeLogin"
                class="closeLogin">
            ✕
        </button>

        <h2 id="loginTitle">
            FRIDAY LOGIN
        </h2>

        <p id="loginSubtitle">
            CREATE YOUR FRIDAY ACCOUNT
        </p>

        <input
            id="username"
            type="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm Password">

        <button id="loginSubmit">
            CREATE ACCOUNT
        </button>

        <button id="switchLogin"
                class="switchBtn">
            Already have an account? SIGN IN
        </button>

        <div id="loginStatus"></div>

    </div>

</div>


<!-- PROFILE -->

<div id="profilePanel">

    <div class="profileBox">

        <button id="closeProfile"
                class="closeLogin">
            ✕
        </button>

        <h2>👤 PROFILE</h2>

        <p id="profileEmail"></p>

        <div class="profileStatus">
            ● ACCOUNT ACTIVE
        </div>

        <button id="logoutBtn">
            LOG OUT
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
