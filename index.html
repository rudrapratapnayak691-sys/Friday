<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FRIDAY MK 2.3</title>

<link rel="icon"
      type="image/png"
      href="icon.png">

<link rel="stylesheet"
      href="style.css">

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- MEDIAPIPE HANDS -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>


<body class="locked">


<!-- =====================================
     FRIDAY OPENING ANIMATION
===================================== -->

<div id="fridayIntro">

    <img
        src="icon.png"
        id="introLogo"
        alt="FRIDAY">

</div>


<!-- =====================================
     MAIN FRIDAY UI
===================================== -->

<div id="app">


    <!-- HEADER -->

    <header id="header">

        <div id="brand">

            <img
                src="icon.png"
                id="brandIcon"
                alt="FRIDAY">

            <div>

                <div id="title">
                    FRIDAY
                </div>

                <div id="version">
                    MARK 2.3
                </div>

            </div>

        </div>


        <div id="profile">
            GUEST
        </div>

    </header>


    <!-- STATUS -->

    <div id="status">
        FRIDAY — SLEEP MODE
    </div>


    <!-- CORE -->

    <div id="core">

        <div id="coreRing">

            <div id="coreLetter">
                F
            </div>

        </div>

    </div>


    <!-- REPLY -->

    <div id="reply">
        SYSTEM STANDBY
    </div>


    <!-- COMMAND -->

    <div id="inputArea">

        <input
            id="command"
            type="text"
            disabled
            placeholder="FRIDAY is sleeping..."
            autocomplete="off">

        <button id="sendBtn">
            SEND
        </button>

    </div>


    <!-- MAIN BUTTONS -->

    <div id="controls">

        <button id="unlockBtn">
            🔓
            <small>UNLOCK</small>
        </button>

        <button id="voiceBtn">
            🎤
        </button>

        <button id="neuralBtn">
            🧠
        </button>

        <button id="handBtn">
            ✋
        </button>

        <button id="loginBtn">
            👤
        </button>

    </div>


</div>


<!-- =====================================
     NEURAL SCREEN
===================================== -->

<div id="neuralScreen">

    <canvas id="neuralCanvas"></canvas>

    <button id="exitNeural">
        ✕
    </button>

</div>


<!-- =====================================
     CAMERA
===================================== -->

<div id="cameraBox">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <div id="handStatus">
        CAMERA OFF
    </div>

    <div id="gesture">
        ✋ HAND
    </div>

    <button id="closeHand">
        CLOSE
    </button>

</div>


<canvas id="handCanvas"></canvas>


<!-- =====================================
     LOGIN
===================================== -->

<div id="loginPanel">

    <div id="loginBox">

        <button id="closeLogin">
            ✕
        </button>

        <h2>
            FRIDAY LOGIN
        </h2>

        <input
            id="username"
            type="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button id="loginSubmit">
            SIGN IN
        </button>

        <div id="loginStatus">
            ENTER CREDENTIALS
        </div>

    </div>

</div>


<!-- =====================================
     SCRIPT
===================================== -->

<script src="script.js"></script>


<!-- =====================================
     OPENING ANIMATION
===================================== -->

<script>

setTimeout(() => {

    const intro =
        document.getElementById(
            "fridayIntro"
        );

    if (intro) {

        intro.classList.add(
            "introFinished"
        );

        setTimeout(() => {

            intro.remove();

        }, 700);

    }

}, 2800);

</script>


</body>

</html>
