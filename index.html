<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">

<title>FRIDAY MARK 2.1</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>

<body>

<div id="ui">

<header>
  <div>
    <small>STARK INDUSTRIES</small>
    <h2>F.R.I.D.A.Y <span>MK 2.1</span></h2>
  </div>

  <button onclick="toggleLock()">🔒</button>
</header>

<div class="hud">

  <div class="core">

    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>

    <div class="energy"></div>

    <div class="coreText">F</div>

  </div>

</div>

<div id="status">SYSTEM LOCKED</div>

<div class="buttons">

<button onclick="startHands()">
✋
<small>HAND</small>
</button>

<button onclick="voice()">
🎤
<small>VOICE</small>
</button>

<button onclick="showNeural()">
🧠
<small>NEURAL</small>
</button>

</div>

<div class="command">

<input id="cmd"
placeholder="Ask FRIDAY...">

<button onclick="run()">➤</button>

</div>

<div id="reply">
Awaiting command...
</div>

</div>


<!-- NEURAL MODE -->

<div id="neural">

<button class="exit"
onclick="hideNeural()">✕ EXIT</button>

<h1>NEURAL SYSTEM</h1>

<div class="neuralStatus">
● NEURAL CORE ONLINE
</div>

<canvas id="brain"></canvas>

</div>


<!-- HAND CAMERA -->

<div id="handUI">

<video id="video"
autoplay
playsinline></video>

<canvas id="handCanvas"></canvas>

<div class="handText">
HAND TRACKING ONLINE
</div>

<button onclick="stopHands()">✕</button>

</div>


<script src="script.js"></script>

</body>
</html>
